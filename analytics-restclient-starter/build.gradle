dependencies {
    // 'implementation', not 'api': nothing in this starter's public surface re-exposes these types.
    implementation project(':contract-bus')
    implementation project(':analytics-contract')

    // Only to translate HTTP errors into the same domain exceptions as the local implementation.
    implementation project(':market-data-contract')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework:spring-web'

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
