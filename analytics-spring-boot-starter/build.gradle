dependencies {
    // 'implementation', not 'api': nothing in this starter's public surface re-exposes these types.
    implementation project(':action-router')
    implementation project(':analytics-action')

    // Only for the FindPricesQuery/PricePoint/MarketDataRefreshed types carried by the router.
    implementation project(':market-data-action')

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-autoconfigure'

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
