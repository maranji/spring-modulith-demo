// Modulo "contratto": dipende solo da messaging-api (l'astrazione generica
// di message bus). NON dipende da market-data-api: le eccezioni dell'altro
// modulo sono citate solo nel Javadoc (@throws), non nella firma dei
// messaggi, per non introdurre un accoppiamento a compile-time che non
// serve al contratto.
dependencies {
    api project(':messaging-api')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}
