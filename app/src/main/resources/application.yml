server:
  port: 8080

spring:
  application:
    name: financial-analytics-poc
  datasource:
    url: jdbc:h2:mem:modulith-poc;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

market-data:
  directory: classpath:data/
  refresh-interval: PT5M
  refresh-enabled: true

# Only used when app is built with -PanalyticsMode=remote.
analytics:
  remote:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example: INFO
