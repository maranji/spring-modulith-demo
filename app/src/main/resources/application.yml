server:
  port: 8080

spring:
  application:
    name: financial-analytics-poc

market-data:
  directory: classpath:data/
  refresh-interval: PT5M
  refresh-enabled: true

# Only used when app is built with -PanalyticsMode=remote.
analytics:
  remote:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example: INFO
