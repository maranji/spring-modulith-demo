plugins {
    id 'org.springframework.boot'
}

// 'local' (default) or 'remote': ./gradlew :app:bootRun -PanalyticsMode=remote
def analyticsMode = (findProperty('analyticsMode') ?: 'local').toString()

dependencies {
    implementation project(':action-router')
    implementation project(':market-data-action')
    implementation project(':analytics-action')

    implementation project(':action-router-spring-boot-starter')

    implementation project(':market-data-spring-boot-starter')

    // Mutually exclusive: both on the classpath would register two handlers for the same action.
    if (analyticsMode == 'remote') {
        implementation project(':analytics-restclient-starter')
    } else {
        implementation project(':analytics-spring-boot-starter')
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveFileName = 'app.jar'
}

tasks.register('printAnalyticsMode') {
    doLast {
        println "analyticsMode = ${analyticsMode}"
    }
}
