plugins {
    id 'org.springframework.boot'
}

// 'local' (default) or 'remote': ./gradlew :app:bootRun -PanalyticsMode=remote
def analyticsMode = (findProperty('analyticsMode') ?: 'local').toString()

dependencies {
    implementation project(':contract-bus')
    implementation project(':market-data-contract')
    implementation project(':analytics-contract')

    implementation project(':contract-bus-spring-boot-starter')

    implementation project(':market-data-spring-boot-starter')

    // Mutually exclusive: both on the classpath would register two handlers for the same contract.
    if (analyticsMode == 'remote') {
        implementation project(':analytics-restclient-starter')
    } else {
        implementation project(':analytics-spring-boot-starter')
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Event Publication Registry: guaranteed event delivery without an external broker.
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    // spring-modulith-starter-jdbc brings no connection pool: without it there is no DataSource.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
}

bootJar {
    archiveFileName = 'app.jar'
}

tasks.register('printAnalyticsMode') {
    doLast {
        println "analyticsMode = ${analyticsMode}"
    }
}
